[workspace]
resolver = "2"
members = [
    "crates/forklift-core",
    "crates/forklift",
    "crates/forklift-server",
    "crates/forklift-aws-lambda",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
repository = "https://github.com/lonic-software/forklift"
license = "MIT OR Apache-2.0"

# The standing guard against an unbounded decode of untrusted bytes (FORK-45): a bare
# `zstd::stream::decode_all` anywhere in the workspace is a hard build failure unless the
# call site carries its own `#[allow(clippy::disallowed_methods)]` with a trusted-bytes
# justification (see clippy.toml for the disallowed path and its reason).
[workspace.lints.clippy]
disallowed_methods = "deny"

[workspace.dependencies]
forklift-core = { path = "crates/forklift-core" }
axum = "0.8"
blake3 = "1.5.4"
# Already in the tree transitively via reqwest/hyper/http; promoted to a direct dependency so
# `remote_utils.rs` can slice an upload's chunks off one refcounted `Bytes` (zero-copy) instead of
# allocating a second full copy of the body (FORK-49 slice 2 review, S2-F6).
bytes = "1"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
zstd = "0.13.2"
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.16"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "compression-zstd", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1.16.0"
flume = "0.11.0"
libc = "0.2"
memmap2 = "0.9"
# Per-bucket checksums in the pack index (FORK-118). Already in the tree through flate2, so this
# pins no new crate.
crc32fast = "1.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Windows only: a directory entry's own file id, opened without following a reparse point, for the
# inventory's device/inode identity and the alias probe.
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
rand = "0.8"
# No `zstd` feature: reqwest decodes (and so advertises) every codec it is built with, and the
# zstd decoder's window (up to 128 MiB under a hostile frame) would sit beneath every response
# cap in util/body_utils.rs. gzip's window is a fixed 32 KiB (FORK-80).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "socks", "stream"] }
# Already in the tree under reqwest, at the same version; named directly only so a transport
# error's source chain can be asked whether the remote closed before its answer was complete.
hyper = { version = "1", default-features = false }
# Likewise under reqwest, and for the same reason: so a transport error's source chain can be
# asked whether the TLS handshake was rejected. No features: the crypto provider stays reqwest's
# choice (and aws-lc stays out of the tree).
rustls = { version = "0.23", default-features = false }
percent-encoding = "2"
regex = "1.10.6"
# Canonical decomposition for the case-alias candidate key (alias_utils::fold_key).
unicode-normalization = "0.1.25"
toml_edit = "0.23"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
# Doc generation only (the `docgen` feature, never enabled in a release build — see
# bin/gen-docs): derives JSON Schema for the `--json` output structs. `chrono04` covers
# `history`'s `DateTime<Utc>` field. Pulls in no TLS/crypto crate (no aws-lc risk).
schemars = { version = "1.2", features = ["chrono04"] }
# Constant-time secret comparison (bearer tokens): already in the tree transitively via
# ed25519-dalek, promoted to a direct dependency for the two server heads' auth checks so a
# byte-wise `==` never regresses back in. Zero dependencies of its own — pins no new crate.
subtle = "2.6"
# Test-only (a forklift-core dev-dependency): already in the tree through reqwest's gzip decoder.
flate2 = "1"
