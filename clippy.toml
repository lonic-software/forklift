    { path = "reqwest::Response::chunk", reason = "whole-body response reads go through util::body_utils (read_body_capped / read_json_capped), which cap what a peer can make the client hold" },
    { path = "reqwest::Response::bytes_stream", reason = "whole-body response reads go through util::body_utils (read_body_capped / read_json_capped), which cap what a peer can make the client hold" },
]
