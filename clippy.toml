    { path = "zstd::zstd_safe::DCtx::try_create", reason = "every zstd decoder of untrusted bytes is built by object_utils::bounded_zstd_decoder / bounded_zstd_dictionary_decoder, which bound the frame window (a frame can otherwise make its decoder hold up to 128 MiB)" },
    { path = "zstd::zstd_safe::DCtx::decompress_stream", reason = "every zstd decoder of untrusted bytes is built by object_utils::bounded_zstd_decoder / bounded_zstd_dictionary_decoder, which bound the frame window (a frame can otherwise make its decoder hold up to 128 MiB)" },
    { path = "zstd::zstd_safe::zstd_sys::ZSTD_decompressStream", reason = "every zstd decoder of untrusted bytes is built by object_utils::bounded_zstd_decoder / bounded_zstd_dictionary_decoder, which bound the frame window (a frame can otherwise make its decoder hold up to 128 MiB)" },
    { path = "reqwest::Response::bytes", reason = "whole-body response reads go through util::body_utils (read_body_capped / read_json_capped), which cap what a peer can make the client hold" },
