# Proof Load over a real history: the fidelity round trips, git to Forklift to git and Forklift to
# git to Forklift, also take this repository's own history (--history-from), besides their fixtures,
# and the damaged-file rows run over a sample of its positions, git's both over the history and over
# Forklift's export of it. Linux only, weekly, and on a pull request that changes this file, so a
# change to this workflow runs before it merges; a change to the harness alone waits for the weekly
# run.
# The checkout is a full clone: the harness refuses a shallow one.
#
# Non-blocking like the per-PR lane: the history job's run step continues on error, and neither
# job is part of the `ci passed` gate.
name: proof load history

on:
  pull_request:
    paths:
      - ".github/workflows/proof-load-history.yml"
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: proof-load-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: an empty RUSTFLAGS replaces the macOS split-debuginfo entry of .cargo/config.toml.
  RUSTFLAGS: ""

jobs:
  history:
    name: proof load history
    runs-on: ubuntu-latest
    # The hang guard, well past a normal run (the scenario lanes, then the history's imports and
    # exports, each of which may take up to 30 minutes, then the history's damage lane: its own
    # builds, the export git's second subject is built from among them, and baselines, then rows
    # that start for at most two hours, the last of which may run on past them): a job cut by it
    # writes no report. The budget the run is graded on is --budget below: the hour the rest takes,
    # the damage lane's two hours of rows, and an hour for its builds, its baselines and its last
    # row.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A checkout holds its branches as remote-tracking refs, and Forklift imports local
      # branches only: each origin branch is made a local one, so the history is every branch.
      - name: Make each origin branch local
        run: |
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx HEAD |
            while read -r branch; do git update-ref "refs/heads/$branch" "refs/remotes/origin/$branch"; done
          # A pull request's checkout is a detached merge commit, which the harness refuses as a
          # history: it is put on a branch of its own, the work tree left as it is. -C, since the
          # loop above may already have made a branch of that name from a remote one.
          git symbolic-ref -q HEAD > /dev/null || git switch -q -C proof-load-checkout
          git symbolic-ref HEAD
          git for-each-ref --format=x refs/heads | wc -l

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: history

      - name: Build the binaries under test and the harness
        run: cargo build --release --locked -p forklift -p forklift-server -p proof-load

      - name: Run
        id: run
        continue-on-error: true
        run: |
          bin=target/release
          "$bin/proof-load" run --source . --out "$RUNNER_TEMP/proof-load" --budget 14400 \
            --forklift "$bin/forklift" --forklift-server "$bin/forklift-server" --git "$(command -v git)" \
            --history-from .

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo "Run step: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/proof-load/report.md" ]; then cat "$RUNNER_TEMP/proof-load/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-load-history
          path: |
            ${{ runner.temp }}/proof-load/*.json
            ${{ runner.temp }}/proof-load/report.md
          if-no-files-found: warn

  # The merge replay over another project's history: a sample of git.git's merges, at a pinned
  # commit, replayed through Forklift and compared with git's. The pin and the seed keep the sample
  # the same from run to run, so its run step does not continue on error: a red is news about
  # Forklift, resolved by an entry in crates/proof-load/replay-tickets.json and its ticket. The
  # seed moves to the run number, by hand and once, the first time no entry is keyed to a merge of
  # the seed-7 sample; the guide's replay section says so.
  replay-git:
    name: proof load replay git
    runs-on: ubuntu-latest
    # The hang guard. On macOS, with release forklift, the 200 merges took 465 s: 179 s to import
    # and 286 s to replay.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: replay-git

      - name: Build the binary under test and the harness
        run: cargo build --release --locked -p forklift -p proof-load

      - name: Clone git.git at the pin
        run: |
          git clone -q --bare https://github.com/git/git.git "$RUNNER_TEMP/git.git"
          git -C "$RUNNER_TEMP/git.git" cat-file -e e1ec09b23c8e0deb21a0b95ac5996422277395d4^{commit}

      - name: Run
        id: run
        run: |
          bin=target/release
          "$bin/proof-load" replay --source "$RUNNER_TEMP/git.git" --ref e1ec09b23c8e0deb21a0b95ac5996422277395d4 \
            --sample 200 --seed 7 --out "$RUNNER_TEMP/replay" --forklift "$bin/forklift" --git "$(command -v git)"

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo "Run step: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/replay/replay.md" ]; then cat "$RUNNER_TEMP/replay/replay.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-load-replay-git
          path: |
            ${{ runner.temp }}/replay/replay.json
            ${{ runner.temp }}/replay/replay.md
          if-no-files-found: warn
