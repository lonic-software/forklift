# Proof Load over a real history: the fidelity round trips, git to Forklift to git and Forklift to
# git to Forklift, also take this repository's own history (--history-from), besides their
# fixtures. Linux only, weekly, and on a pull request that changes this file, so a change to
# this workflow runs before it merges; a change to the harness alone waits for the weekly run.
# The checkout is a full clone: the harness refuses a shallow one.
#
# Non-blocking like the per-PR lane: the run step continues on error, and it is not part of the
# `ci passed` gate.
name: proof load history

on:
  pull_request:
    paths:
      - ".github/workflows/proof-load-history.yml"
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: proof-load-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: an empty RUSTFLAGS replaces the macOS split-debuginfo entry of .cargo/config.toml.
  RUSTFLAGS: ""

jobs:
  history:
    name: proof load history
    runs-on: ubuntu-latest
    # The hang guard, well past a normal run (the scenario lanes, then the history's imports and
    # exports, each of which may take up to 30 minutes, then the history's damage rows, which
    # start for at most two hours): a job cut by it writes no report. The budget the run is
    # graded on is --budget below, the one hour the rest takes plus the damage rows' two.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A checkout holds its branches as remote-tracking refs, and Forklift imports local
      # branches only: each origin branch is made a local one, so the history is every branch.
      - name: Make each origin branch local
        run: |
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx HEAD |
            while read -r branch; do git update-ref "refs/heads/$branch" "refs/remotes/origin/$branch"; done
          git for-each-ref --format=x refs/heads | wc -l

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: history

      - name: Build the binaries under test and the harness
        run: cargo build --release --locked -p forklift -p forklift-server -p proof-load

      - name: Run
        id: run
        continue-on-error: true
        run: |
          bin=target/release
          "$bin/proof-load" run --source . --out "$RUNNER_TEMP/proof-load" --budget 10800 \
            --forklift "$bin/forklift" --forklift-server "$bin/forklift-server" --git "$(command -v git)" \
            --history-from .

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo "Run step: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/proof-load/report.md" ]; then cat "$RUNNER_TEMP/proof-load/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-load-history
          path: |
            ${{ runner.temp }}/proof-load/*.json
            ${{ runner.temp }}/proof-load/report.md
          if-no-files-found: warn
