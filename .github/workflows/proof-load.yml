# Proof Load, the per-PR lane: fault the binaries users get. forklift and forklift-server are built
# from the pull request's head for the release target of each OS (release.yml's matrix), not the
# host default the test job builds, and the harness runs its completeness checks, every
# damaged-file binding, and the environment and volume faults against one small seed.
#
# Non-blocking while its flake rate is unknown: the run step continues on error, so the job reports
# its grades without failing the check. Whether and how it gates after the trial is FORK-445.
name: proof load

on:
  pull_request:

concurrency:
  group: proof-load-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: an empty RUSTFLAGS replaces the macOS split-debuginfo entry of .cargo/config.toml.
  RUSTFLAGS: ""

jobs:
  proof-load:
    name: proof load (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # The hang guard. The budget the run is graded on is --budget below, which lets every scenario
    # finish first.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools, strace and dosfstools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools strace dosfstools

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the binaries under test
        run: cargo build --release --locked --target ${{ matrix.target }} -p forklift -p forklift-server

      - name: Build the harness
        run: cargo build --release --locked -p proof-load

      # Disk full needs a small volume of its own for the harness to fill: a size-capped tmpfs on
      # Linux, a RAM disk on macOS. Windows builds none.
      - name: Make the capped volume
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            capped="$RUNNER_TEMP/capped"; mkdir -p "$capped"
            sudo mount -t tmpfs -o size=128m,mode=1777 tmpfs "$capped"
          else
            device=$(hdiutil attach -nomount ram://262144 | awk '{print $1}')
            diskutil erasevolume HFS+ PLCAP "$device"
            capped=/Volumes/PLCAP
          fi
          df -h "$capped"
          echo "CAPPED=$capped" >> "$GITHUB_ENV"

      # The volume faults need a volume that folds case and keeps no executable bit, for the work
      # tree a clone moves onto: a loop-mounted vfat on Linux, owned by the runner's user, and an
      # exFAT image on macOS. Windows builds none. The harness probes what it is given, so a volume
      # that turns out to keep the bit or the case reports that cell not run, never as coverage.
      - name: Make the folding volume
        if: runner.os != 'Windows'
        shell: bash
        run: |
          folding="$RUNNER_TEMP/folding"; mkdir -p "$folding"
          if [ "$RUNNER_OS" = Linux ]; then
            truncate -s 64M "$RUNNER_TEMP/folding.img"
            mkfs.vfat "$RUNNER_TEMP/folding.img"
            sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" "$RUNNER_TEMP/folding.img" "$folding"
          else
            hdiutil create -size 64m -fs ExFAT -volname PLFOLD "$RUNNER_TEMP/folding.dmg"
            hdiutil attach -nobrowse -mountpoint "$folding" "$RUNNER_TEMP/folding.dmg"
          fi
          df -h "$folding"
          echo "FOLDING=$folding" >> "$GITHUB_ENV"

      - name: Run
        id: run
        continue-on-error: true
        shell: bash
        run: |
          exe=""; git=$(command -v git); kill=(); capped=(); folding=()
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; git=$(cygpath -w "$git"); fi
          # Kill points need strace, so Linux only; one scenario's keep the lane inside its budget.
          if [ "$RUNNER_OS" = Linux ]; then kill=(--strace "$(command -v strace)" --kill history --power history --power-variants 4); fi
          if [ -n "${CAPPED:-}" ]; then capped=(--capped-volume "$CAPPED/proof-load" --disk-full history --disk-full compacted); fi
          # A folder inside the volume, never its mount point, which the system may write into.
          if [ -n "${FOLDING:-}" ]; then folding=(--folding-volume "$FOLDING/proof-load"); fi
          bin=target/${{ matrix.target }}/release
          target/release/proof-load$exe run --source . --out "$RUNNER_TEMP/proof-load" --budget 2700 \
            --forklift "$bin/forklift$exe" --forklift-server "$bin/forklift-server$exe" --git "$git" \
            --read-only history --read-only compacted --network lifted "${kill[@]}" "${capped[@]}" "${folding[@]}"

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "Run step: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/proof-load/report.md" ]; then cat "$RUNNER_TEMP/proof-load/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-load-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/proof-load/*.json
            ${{ runner.temp }}/proof-load/report.md
            ${{ runner.temp }}/proof-load/traces/
          if-no-files-found: warn
