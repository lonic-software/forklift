# Forklift CI: build + test on Linux, macOS and Windows.
#
# All dependencies come from crates.io (the private CodeArtifact registry became
# unnecessary when the CLI moved from `rust-cli-core` to clap), so no credentials or
# other setup is needed beyond a Rust toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run still testing its previous head. Pushes to
# main are never cancelled: each one is grouped by its own commit, so no two share a group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Docs-only pull requests skip the build and tests. This is decided here rather than with
  # `paths-ignore`, because a workflow that never starts reports no checks at all, and a matrix
  # job skipped as a whole reports one check under its unexpanded name. Either would leave a
  # required `test (<os>)` check waiting forever. Instead every matrix job always runs and
  # reports, and only its steps are skipped.
  changes:
    # Pushes to main always test; a skipped classifier reads as "code changed" below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base it merges into, so
          # the diff between them is the pull request's own change.
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          # --no-renames lists both sides of a move, so code moved under docs/ still counts.
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          # An empty diff counts as code, so the tests run.
          code=false
          [ -z "$changed" ] && code=true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              # Anything under crates/ is built, include_str!'d or read by a test.
              crates/*) code=true ;;
              docs/*|*.md)
                # Some tests read docs (a guide table, a documented default). A doc whose
                # repo path appears anywhere in the crates counts as code, so a docs-only
                # change cannot hide the test it breaks. This needs a test to name the doc
                # by its literal repo path. Only "no match" (exit 1) leaves a doc docs-only;
                # a grep that errors counts as code.
                rc=0
                git grep -qF -- "$path" -- crates || rc=$?
                if [ "$rc" -ne 1 ]; then
                  echo "$path is referenced from crates/ (or grep failed), so it counts as code."
                  code=true
                fi ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          [ "$code" = false ] && echo "Docs-only change: build and tests are skipped."
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    # Run even when `changes` was skipped (a push) or failed: a classifier that cannot decide
    # must test, not leave the required checks unreported.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # A docs-only run only has to report its check, so it does not need the OS it is named after.
    runs-on: ${{ (needs.changes.result == 'success' && needs.changes.outputs.code == 'false') && 'ubuntu-latest' || matrix.os }}
    # A hang anywhere in the job (doc-tests included, which nextest does not run) fails here
    # rather than at GitHub's six-hour limit. A cold-cache Windows run takes about fifteen.
    timeout-minutes: 40
    env:
      # Only a classifier that succeeded and said `false` skips; anything else tests. Every
      # step below is gated on this one value, since a job cannot skip its steps but still
      # report its check any other way.
      SKIP_TESTS: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}
    steps:
      - name: Docs-only change
        if: env.SKIP_TESTS == 'true'
        run: echo "Docs-only change, build and tests skipped."

      - uses: actions/checkout@v4
        if: env.SKIP_TESTS != 'true'

      - name: Install stable Rust
        if: env.SKIP_TESTS != 'true'
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: env.SKIP_TESTS != 'true'

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: env.SKIP_TESTS != 'true'
        with:
          tool: cargo-nextest@0.9.146

      - name: Build
        if: env.SKIP_TESTS != 'true'
        run: cargo build --verbose

      # nextest runs every test in its own process and the test binaries in parallel, so one
      # slow binary no longer holds up the rest.
      - name: Test
        if: env.SKIP_TESTS != 'true'
        # Twice as many test threads as cores on Linux and Windows: many tests spend their time
        # waiting (on a timeout, a server, a child process), not computing, so the default of one
        # per core leaves cores idle. The macOS runner's disk is the bottleneck instead — doubling
        # there more than doubled the run — so it keeps nextest's default. Tests that write with
        # fsync on take two slots each (see .config/nextest.toml).
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo nextest run --workspace --no-fail-fast
          else
            cores=${NUMBER_OF_PROCESSORS:-$(nproc)}
            [ -n "$cores" ] || { echo "could not count cores"; exit 1; }
            echo "cores=$cores test-threads=$(( cores * 2 ))"
            cargo nextest run --workspace --no-fail-fast --test-threads "$(( cores * 2 ))"
          fi

      # nextest does not run doc-tests.
      - name: Doc-tests
        if: env.SKIP_TESTS != 'true'
        run: cargo test --workspace --doc --no-fail-fast

      - name: Clippy
        if: env.SKIP_TESTS != 'true'
        # Style-level lint debt is tracked separately; deny only warnings that indicate
        # correctness issues once the doc-comment cleanup lands. For now, report-only.
        run: cargo clippy
