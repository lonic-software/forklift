# Forklift CI: build + test on Linux, macOS and Windows, the tests split across several runners per
# OS; doc-tests, Clippy and the guards once per OS; and a check that docs/generated matches what the
# code generates. `ci passed` sums them up into one check.
# Every share installs clippy and rustfmt, though only one per OS runs Clippy and only the Linux one
# the formatting guard; they are small components.
#
# All dependencies come from crates.io (the private CodeArtifact registry became
# unnecessary when the CLI moved from `rust-cli-core` to clap), so no credentials or
# other setup is needed beyond a Rust toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run still testing its previous head. Pushes to
# main are never cancelled: each one is grouped by its own commit, so no two share a group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Set but empty on purpose: a RUSTFLAGS variable, even an empty one, replaces every rustflags
  # entry in .cargo/config.toml, on every OS. Today the only entry is the macOS split-debuginfo
  # setting, which stops a local incremental build from piling up object files. CI cannot pile them
  # up (rust-cache turns incremental off), and with the setting on, one warm macOS rerun took about
  # 13 s longer and its cache grew from 553 MB to 1015 MB. A rustflags entry added to the config
  # later is not used here either: give it to CI in this variable too. The macOS leg's "Split
  # debuginfo guard" step checks the setting itself, with this variable unset.
  RUSTFLAGS: ""
  # Windows links with rust-lld (lld-link) rather than MSVC's link.exe; Linux already uses rust-lld
  # by default and macOS Apple's ld-prime. A linker setting is not a rustflag, so the empty
  # RUSTFLAGS above leaves it on. Measured with warm caches on 2026-11-04, it cut the Windows test
  # build by about 12% of summed unit time, roughly 20 s per share (docs/guide/contributing.md).
  # CI only: release.yml keeps link.exe for the shipped binaries.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  # Docs-only pull requests skip the build and tests. This is decided here rather than with
  # `paths-ignore`, because a workflow that never starts reports no checks at all, which would
  # leave `ci passed` (the check to gate on, at the end) waiting forever. Instead the test jobs
  # are skipped, and `ci passed` accepts the skip only when this job decided it.
  changes:
    # Pushes to main always test; a skipped classifier reads as "code changed" below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base it merges into, so
          # the diff between them is the pull request's own change.
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          # --no-renames lists both sides of a move, so code moved under docs/ still counts.
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          # An empty diff counts as code, so the tests run.
          code=false
          [ -z "$changed" ] && code=true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              # Anything under crates/ is built, include_str!'d or read by a test.
              crates/*) code=true ;;
              docs/*|*.md)
                # Some tests read docs (a guide table, a documented default). A doc whose
                # repo path appears anywhere in the crates counts as code, so a docs-only
                # change cannot hide the test it breaks. This needs a test to name the doc
                # by its literal repo path. Only "no match" (exit 1) leaves a doc docs-only;
                # a grep that errors counts as code.
                rc=0
                git grep -qF -- "$path" -- crates || rc=$?
                if [ "$rc" -ne 1 ]; then
                  echo "$path is referenced from crates/ (or grep failed), so it counts as code."
                  code=true
                fi ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          [ "$code" = false ] && echo "Docs-only change: build and tests are skipped."
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # docs/generated (error codes, command list, --json schemas) is rendered from the code by
  # bin/gen-docs. This job regenerates it and fails if the committed copy differs, so a change
  # to an error code, a command, an alias or an output struct cannot land without its page. It
  # runs on every pull request, docs-only ones included, since a hand edit of a generated page
  # is exactly the drift it exists to catch.
  generated-docs:
    name: generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check docs/generated is current
        run: ./bin/gen-docs --check

  # The test suite, split across runners. A runner's test phase is short of cores rather than
  # slow per test (on 2026-11-03 Windows summed 3,540 s of tests into 469 s on 4 cores), so each
  # extra runner divides it almost evenly. Each OS's entries list its share as partition/partitions;
  # nextest's `count` scheme deals every test binary's tests round-robin across them, which spreads
  # a binary's slow tests over all of them. Replaying that run's
  # per-test times over the three schemes put the slowest Windows share at 142–144 s for every one,
  # against a single longest test of 123 s, so more Windows shares bought little until that test
  # was faster. FORK-380 has since shortened the slowest tests; re-measure before changing the
  # share count. Every entry runs on GitHub's runners. An entry may set `blacksmith` to a runner label
  # instead (6 vCPU macOS on Apple silicon was tried on 2026-11-03: no queue, where GitHub's macOS
  # jobs waited five to fifteen minutes and some were never given a runner), but Blacksmith bills
  # each minute, about 0.5 USD a macOS run, so macOS's is empty until that cost is agreed. A label
  # is used only for this repository's own branches: a pull request from a fork, or a run in a fork, gets
  # GitHub's runner, so unreviewed code never runs on a billed one and a fork never asks for a
  # runner it does not have. To change a count, edit the entries; `ci passed` fails a run whose
  # shares for an OS are not exactly 1/N to N/N.
  test:
    name: test (${{ matrix.os }}${{ matrix.partitions > 1 && format(', {0}/{1}', matrix.partition, matrix.partitions) || '' }})
    needs: changes
    # Run when `changes` was skipped (a push) or failed too: a classifier that cannot decide must
    # test. Only one that succeeded and said `false` skips, and `ci passed` accepts the skip then.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, partition: 1, partitions: 1 }
          - { os: macos-latest, blacksmith: '', partition: 1, partitions: 1 }
          - { os: windows-latest, partition: 1, partitions: 4 }
          - { os: windows-latest, partition: 2, partitions: 4 }
          - { os: windows-latest, partition: 3, partitions: 4 }
          - { os: windows-latest, partition: 4, partitions: 4 }
    runs-on: ${{ matrix.blacksmith && github.repository == 'lonic-software/forklift' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.blacksmith || matrix.os }}
    # A hang anywhere in the job fails here rather than at GitHub's six-hour limit. A cold-cache
    # Windows run compiles for about eight minutes before its tests start.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      # The tree is formatted by hand and rustfmt.toml switches rustfmt off; bin/fmt-guard fails if
      # that guard is missing, or if a second rustfmt config would override it. It needs no build,
      # so it runs first, and its answer does not depend on the OS, so one leg runs it.
      - name: Formatting guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: ./bin/fmt-guard

      # One OS's shares build under the same cache key, and a key is saved once. The last share
      # saves it: it is the one that also builds for the doc-tests and Clippy, so the cache holds
      # their artifacts too, and no two shares race to upload the same files.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.partition == matrix.partitions }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146

      - name: Build
        id: build
        run: cargo build --verbose

      # nextest runs every test in its own process and the test binaries in parallel, so one
      # slow binary no longer holds up the rest.
      - name: Test
        # Twice as many test threads as cores: many tests spend their time waiting (on a timeout,
        # a server, a child process), not computing, so the default of one per core leaves cores
        # idle.
        shell: bash
        run: |
          cores=${NUMBER_OF_PROCESSORS:-$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || true)}
          case "$cores" in
            ''|0|*[!0-9]*) echo "could not count cores (got '$cores')"; exit 1 ;;
          esac
          echo "cores=$cores test-threads=$(( cores * 2 ))"
          cargo nextest run --workspace --no-fail-fast --profile ci --test-threads "$(( cores * 2 ))" \
            --partition "count:${{ matrix.partition }}/${{ matrix.partitions }}"

      # What is not split runs once per OS, on its last share, reusing that share's build: the
      # doc-tests (nextest does not run them), Clippy and the split-debuginfo guard. Not in a job of
      # its own, which would need a second macOS runner and its build (see the note on macOS above).
      # The doc-tests and Clippy run after failed tests, but not after a failed build, which they
      # would only repeat.
      - name: Doc-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.partition == matrix.partitions }}
        run: cargo test --workspace --doc --no-fail-fast

      - name: Clippy
        # Style-level lint debt is tracked separately; deny only warnings that indicate
        # correctness issues once the doc-comment cleanup lands. For now, report-only.
        # --all-targets so clippy.toml's bans reach test code too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.partition == matrix.partitions }}
        run: cargo clippy --workspace --all-targets

      # CI builds with the config's rustflags switched off (see RUSTFLAGS above), so this checks
      # what developers get on macOS. A throwaway crate is built twice, as a developer would build
      # it (RUSTFLAGS unset, incremental on): with cargo's default it must leave object files in its
      # deps directory, which shows the probe can see them, and under .cargo/config.toml it must
      # leave none. It fails if a toolchain stops honouring the setting, for instance by putting
      # cargo's own "-Csplit-debuginfo=unpacked" after it. It runs last so a failure here does not
      # hide what the doc-tests and Clippy would report, and after a failed step too.
      - name: Split debuginfo guard
        if: ${{ !cancelled() && runner.os == 'macOS' && matrix.partition == matrix.partitions }}
        shell: bash
        run: |
          probe="$RUNNER_TEMP/split-debuginfo-probe"
          cargo new --quiet --lib "$probe"
          count() {
            (cd "$probe" && env -u RUSTFLAGS -u CARGO_INCREMENTAL cargo build --quiet) || return 1
            find "$probe/target/debug/deps" -name '*.rcgu.o' | wc -l
          }
          default=$(count)
          rm -rf "$probe/target"
          mkdir "$probe/.cargo"
          cp .cargo/config.toml "$probe/.cargo/"
          packed=$(count)
          echo "object files left in deps: $default with cargo's default, $packed with the config"
          [ "$default" -gt 0 ] && [ "$packed" -eq 0 ]

  # The one check to gate a merge on. It needs every job above and passes only when each one
  # passed, or was skipped for a reason that is not a failure: `changes` is skipped on pushes, and
  # the test jobs are skipped when `changes` succeeded and found a docs-only change. A failed
  # `changes` is accepted when the tests ran and passed, since that is what its failure asks for. A
  # matrix job reports one check per entry, and a skipped one a single check under its unexpanded
  # name, so gating on this name stays the same however the shares are cut.
  ci-passed:
    name: ci passed
    needs: [changes, generated-docs, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check every job
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.generated-docs.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES (code=$CODE) generated-docs=$DOCS test=$TEST"
          docs_only=false
          [ "$CHANGES" = success ] && [ "$CODE" = false ] && docs_only=true
          ok=true
          case "$CHANGES" in success|skipped|failure) ;; *) ok=false ;; esac
          [ "$DOCS" = success ] || ok=false
          if ! { [ "$TEST" = success ] || { [ "$TEST" = skipped ] && [ "$docs_only" = true ]; }; }; then
            ok=false
          fi
          [ "$ok" = true ]

      # A share left out of the matrix would drop its tests without failing anything, so this
      # reads the names of the test jobs that ran and requires each OS's shares to be exactly
      # 1/N to N/N (a single unsplit job counts as 1/1).
      - name: Check the test shares
        if: ${{ needs.test.result == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
            --jq '.jobs[].name' > jobs.txt
          python3 - jobs.txt <<'PY'
          import re, sys
          shares = {}
          for name in open(sys.argv[1]).read().splitlines():
              if not name.startswith("test ("):
                  continue
              # A test job whose name this cannot read fails the check rather than drop out of it.
              m = re.fullmatch(r"test \((\S+?)(?:, (\d+)/(\d+))?\)", name)
              if not m:
                  sys.exit(f"cannot read the share of test job {name!r}")
              shares.setdefault(m[1], []).append((int(m[2] or 1), int(m[3] or 1)))
          print(shares)
          bad = [os for os, got in shares.items()
                 if sorted(got) != [(k, got[0][1]) for k in range(1, got[0][1] + 1)]]
          if not shares or bad:
              sys.exit(f"incomplete test shares: {bad or 'no test jobs found'}")
          PY
