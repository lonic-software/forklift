# Real-account deploy-and-verify for infra/aws-serverless (FORK-60, "Layer 3" — see
# infra/aws-serverless/README.md's Testing section).
#
# Scheduled and workflow_dispatch ONLY — deliberately never on push or pull_request: a public
# repo cannot hand fork PRs credentials to a real AWS account, and per-PR real-account CI was
# rejected outright on exactly that basis. Layer 1 (tests/main.tftest.hcl, mock_provider) and
# Layer 2 (LocalStack apply-and-exercise) already cover every PR; this workflow is the only place
# real IAM enforcement, real arm64 Lambda boot, real API Gateway semantics, and the presigned-URL
# / async-promotion KMS interactions get pinned at all — see infra/aws-serverless/verify.sh's own
# header comment for the full "why" and its "unverified until a real run" list.
#
# SCOPE, decided narrowly on purpose: this workflow VERIFIES the already-deployed dogfood staging
# stack (infra/aws-serverless/examples/staging/); it does not run `tofu apply`/`destroy` itself.
# The stack's outputs (api endpoint, bucket, table) are expected to be stable between scheduled
# runs and are supplied as repository secrets rather than re-read via `tofu output`, which would
# additionally require this workflow to carry remote-state backend credentials — a separate
# decision this task does not scope. See the FORK-60 Layer 3 report for this as a flagged,
# deliberate scope call rather than a silent omission.
name: AWS serverless — real-account verify (FORK-60 Layer 3)

on:
  schedule:
    # Weekly, not daily. What this job can actually detect between runs is AWS-side drift — a
    # patched Lambda runtime, changed service behaviour, an expiring certificate — because nothing
    # deploys the stack automatically; it changes only when someone applies. That drift moves on a
    # scale of weeks, so a daily run mostly re-proves yesterday's answer.
    #
    # Cadence is also the lever on this stack's retention problem, which is why it is worth stating
    # rather than leaving to taste. Each run adds ~9 MiB that can never deduplicate and is never
    # pruned (see verify.sh's bucket_total_size_bytes). Daily is ~3.3 GB/year and reaches the hard
    # size tripwire in roughly 15 months; weekly is ~470 MB/year and reaches it in roughly seven.
    # The tripwire instruments the symptom; the cadence is the cause.
    #
    # The minute/hour is arbitrary, offset from the hour to dodge GitHub's documented pile-up of
    # jobs scheduled exactly on the hour. Run it on demand (workflow_dispatch, below) whenever a
    # point-in-time answer is actually wanted — before a demo, or after touching the stack.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

# One run at a time against the one persistent stack. workflow_dispatch is enabled alongside the
# cron, so two runs can otherwise overlap: both franchise at the same head, both stack a parcel on
# it, and the second lift is refused as not-a-fast-forward by the divergence check. That reddens
# the job for a reason that has nothing to do with the stack, and it is indistinguishable at a
# glance from the asynchronous verifier-KMS failure this workflow exists to catch — the worst
# possible false signal, by this script's own reckoning. cancel-in-progress stays false: a
# half-finished run has already staged objects, and killing it mid-lift is how staging/ leftovers
# get created in the first place.
concurrency:
  group: aws-serverless-verify
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (real AWS account)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Required for OIDC: the job needs to mint a short-lived identity token to exchange for AWS
    # credentials. `contents: read` must be restated because naming any permission drops the
    # defaults for all the others.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Fail fast and legibly when a required secret is absent, rather than half-running: without
      # this, a missing secret surfaces many steps later as a confusing, credential-shaped error
      # from deep inside `aws` or `curl`, instead of a clear "this hasn't been configured" message.
      - name: Check required secrets are present
        shell: bash
        env:
          FORKLIFT_STAGING_ENDPOINT: ${{ secrets.FORKLIFT_STAGING_ENDPOINT }}
          FORKLIFT_STAGING_BUCKET: ${{ secrets.FORKLIFT_STAGING_BUCKET }}
          FORKLIFT_STAGING_TABLE: ${{ secrets.FORKLIFT_STAGING_TABLE }}
          FORKLIFT_STAGING_TOKEN: ${{ secrets.FORKLIFT_STAGING_TOKEN }}
          CHECK_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          CHECK_AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=()
          [[ -n "$FORKLIFT_STAGING_ENDPOINT" ]] || missing+=(FORKLIFT_STAGING_ENDPOINT)
          [[ -n "$FORKLIFT_STAGING_BUCKET" ]] || missing+=(FORKLIFT_STAGING_BUCKET)
          [[ -n "$FORKLIFT_STAGING_TABLE" ]] || missing+=(FORKLIFT_STAGING_TABLE)
          [[ -n "$FORKLIFT_STAGING_TOKEN" ]] || missing+=(FORKLIFT_STAGING_TOKEN)
          [[ -n "$CHECK_AWS_ROLE_ARN" ]] || missing+=(AWS_ROLE_ARN)
          [[ -n "$CHECK_AWS_REGION" ]] || missing+=(AWS_REGION)
          if ((${#missing[@]})); then
            printf 'Missing required repository secret(s): %s\n' "${missing[*]}" >&2
            printf 'This workflow verifies a real, already-deployed staging stack and refuses to half-run without them.\n' >&2
            printf 'See infra/aws-serverless/verify.sh and infra/aws-serverless/examples/staging/.\n' >&2
            exit 1
          fi

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      # verify.sh drives the real `forklift` CLI (prepare/load/stack/lift/franchise/history)
      # against the deployed stack's endpoint — the Lambda binaries themselves are already
      # running there and are not built by this workflow.
      - name: Build the forklift CLI
        run: cargo build -p forklift --release

      # OIDC, not stored keys: the job exchanges a short-lived GitHub identity token for AWS
      # credentials that expire with the run. There is no long-lived secret to leak, which matters
      # more here than usual because this is a public repo. The role's entire permission set is
      # s3:ListBucket on the staging bucket — the only AWS API call verify.sh makes — and its trust
      # policy is scoped to this repository, so a fork cannot assume it.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run verify.sh against the deployed staging stack
        env:
          FORKLIFT_BIN: ${{ github.workspace }}/target/release/forklift
          STAGING_ENDPOINT: ${{ secrets.FORKLIFT_STAGING_ENDPOINT }}
          STAGING_BUCKET: ${{ secrets.FORKLIFT_STAGING_BUCKET }}
          STAGING_TABLE: ${{ secrets.FORKLIFT_STAGING_TABLE }}
          STAGING_TOKEN: ${{ secrets.FORKLIFT_STAGING_TOKEN }}
        run: |
          ./infra/aws-serverless/verify.sh \
            "$STAGING_ENDPOINT" "$STAGING_BUCKET" "$STAGING_TABLE" "$STAGING_TOKEN"
