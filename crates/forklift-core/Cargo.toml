[package]
name = "forklift-core"
description = "Forklift — the base logic shared by every head (objects, inventory, refs, diff, trust)."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
num_cpus = { workspace = true }
flume = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
crc32fast = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
toml_edit = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
# Optional: JSON Schema derivation for the `docgen` feature (see crates/forklift's
# Cargo.toml and bin/gen-docs). Never enabled in a release build.
schemars = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# The capped-reader tests serve a gzip body; flate2 is already in the tree through reqwest's
# `gzip` decoder, so this pins no new crate.
flate2 = { workspace = true }

[features]
docgen = ["dep:schemars"]
