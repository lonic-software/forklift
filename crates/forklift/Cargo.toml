[package]
name = "forklift"
description = "Forklift — a version control system designed for serverless hosting (client CLI)."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "forklift"
path = "src/main.rs"

[dependencies]
forklift-core = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
# Optional: JSON Schema derivation for the `docgen` feature (see bin/gen-docs). A release
# build never enables this feature, so it never compiles into the shipped binary.
schemars = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
docgen = ["dep:schemars", "forklift-core/docgen"]

[dev-dependencies]
# The commit-graph tests check a shard's trailing checksum from the outside, and the bundle
# tests seal a digest over a damaged bundle.
blake3 = { workspace = true }
# The remote tests' mock hook endpoint verifies the signed hook requests with the
# same MAC helper the server signs them with.
serde_json = { workspace = true }
# The guide-page test splits the pages' commands as a POSIX shell would. Already in the tree, at the
# version Cargo.lock pins.
shlex = "2"
# The hint check lexes every Rust source under crates/ to find the string literals that name a
# `forklift` command. Both are already in the tree as clap_derive's own dependencies, at the
# versions Cargo.lock pins.
proc-macro2 = "1"
syn = { version = "2", default-features = false, features = ["parsing"] }

[target.'cfg(windows)'.dev-dependencies]
# The metadata-alias test asks NTFS for the 8.3 short name it gave `.forklift`.
windows-sys = { workspace = true }
